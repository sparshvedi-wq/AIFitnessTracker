services:
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports: ["8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
