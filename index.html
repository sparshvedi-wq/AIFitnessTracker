<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131416" />
    <meta name="description" content="Tally: a workout for the time, place and energy you have today." />
    <link rel="icon" type="image/svg+xml" href="/tally.svg" />
    <title>Tally</title>
    <script>
      // Paint the chosen theme before the app loads, so there is no flash.
      try {
        var pref = localStorage.getItem('tally:theme') || 'system'
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#131416' : '#F4F1EA')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
